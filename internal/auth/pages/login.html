<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f5f6f8; margin: 0; }
    .card { max-width: 380px; margin: 8vh auto; background: #fff; border-radius: 10px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: #666; margin: 0 0 20px; font-size: 14px; }
    label { display: block; font-size: 13px; color: #444; margin: 12px 0 4px; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d0d4da; border-radius: 6px; }
    button { width: 100%; margin-top: 18px; padding: 10px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font-size: 15px; cursor: pointer; }
    .error { background: #fdecea; color: #b3261e; padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 14px; }
    .error:empty { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">to continue to GoLean Auth</p>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{.Next}}">
      <label for="identifier">Email or phone</label>
      <input type="text" id="identifier" name="identifier" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
