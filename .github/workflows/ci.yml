name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build, vet, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: unit tests
        run: go test ./...

  integration:
    name: integration tests against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: goleanauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d goleanauth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: integration tests
        env:
          TEST_DB_URL: postgres://integration:integration@localhost:5432/goleanauth_test?sslmode=disable
        run: go test -tags integration -count=1 ./internal/integration/
