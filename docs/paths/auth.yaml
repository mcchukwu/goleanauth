/v1/auth/register:
  post:
    tags:
      - Authentication

    summary: Register a new user

    description: |
      Creates a new user account using either an email address or
      phone number together with a password.

      At least one of `email` or `phone` must be supplied.

    operationId: register

    requestBody:
      required: true

      content:
        application/json:

          schema:
            $ref: "../components/schemas.yaml#/RegisterRequest"

          examples:

            email:
              summary: Register with email

              value:
                email: miracle@example.com
                first_name: Miracle
                last_name: Chukwu
                password: hellomiracle

            phone:
              summary: Register with phone

              value:
                phone: "+2348012345678"
                first_name: Miracle
                last_name: Chukwu
                password: hellomiracle

    responses:

      "201":

        description: Registration successful

        content:
          application/json:

            schema:
              $ref: "../components/schemas.yaml#/SuccessResponse"

      "400":
        $ref: "../components/responses.yaml#/ValidationError"

      "409":
        description: Email or phone already exists

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
