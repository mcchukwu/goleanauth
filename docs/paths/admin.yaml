/v1/admin/clients:
  post:
    tags:
      - Admin

    summary: Register a new OAuth client

    description: |
      Creates a registered OAuth client. Requires the static admin API key
      configured via `ADMIN_API_KEY`, sent in the `X-Admin-Key` header.

      The client secret is returned only once; store it immediately.

    operationId: createClient

    security:
      - adminKey: []

    requestBody:
      required: true

      content:
        application/json:

          schema:
            type: object

            properties:

              name:
                type: string
                maxLength: 100
                example: My App

              scope:
                type: string
                description: Space-separated scopes the client may request.
                example: "openid profile email"

              redirect_uris:
                type: array
                items:
                  type: string
                  format: uri
                example: ["https://app.example.com/cb"]

            required:
              - name

          examples:

            basic:
              summary: Minimal client
              value:
                name: My App
                scope: "read write"
                redirect_uris: ["https://app.example.com/cb"]

    responses:

      "201":

        description: Client registered

        content:
          application/json:

            schema:
              type: object

              properties:

                success:
                  type: boolean
                  example: true

                message:
                  type: string

                data:
                  type: object

                  properties:

                    client_id:
                      type: string

                    client_secret:
                      type: string
                      description: Shown only once.

      "400":

        description: Validation error

      "404":

        description: Admin API not configured (ADMIN_API_KEY unset)

  get:
    tags:
      - Admin

    summary: List registered clients

    description: |
      Returns all registered clients without any secret material.

    operationId: listClients

    security:
      - adminKey: []

    responses:

      "200":

        description: Clients fetched

        content:
          application/json:

            schema:
              type: object

              properties:

                success:
                  type: boolean
                  example: true

                data:
                  type: array

                  items:

                    type: object

                    properties:

                      client_id:
                        type: string

                      name:
                        type: string

                      scope:
                        type: string

                      active:
                        type: boolean

                      redirect_uris:
                        type: array
                        items:
                          type: string

      "404":

        description: Admin API not configured (ADMIN_API_KEY unset)
